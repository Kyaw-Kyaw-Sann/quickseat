# Production profile: all credentials and deployment-specific values come from environment variables.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Demo data is never created in production.
app.demo-seed.enabled=false

# Keep API documentation disabled by default in production. Enable deliberately with SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.com.quickseat=INFO
logging.level.org.springframework.web=WARN
