spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

logging.level.com.quickseat=INFO
logging.level.org.springframework.web=WARN

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

app.mail.enabled=${MAIL_ENABLED:false}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.verification.base-url=${VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth/verify-email}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.cloudinary.enabled=${CLOUDINARY_ENABLED:false}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Keep pooled connections younger than Neon/pooler idle limits.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
